# ==========================================
# DOCKER COMPOSE - ESCUELA PARA PADRES
# ==========================================

version: '3.8'

services:
  # Servicio principal del backend
  escuela-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escuela-backend
    restart: unless-stopped
    ports:
      - "3334:3333"
    environment:
      - NODE_ENV=production
      - PORT=3333
      - HOST=0.0.0.0
      # Variables de Supabase
      - DB_HOST=${DB_HOST:-aws-0-us-west-2.pooler.supabase.com}
      - DB_PORT=${DB_PORT:-6543}
      - DB_USER=${DB_USER:-postgres.dlchjtewqwpuichmuxwr}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE:-postgres}
      # Variables de aplicación
      - APP_KEY=${APP_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./tmp:/app/tmp
    networks:
      - escuela-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx para reverse proxy (opcional)
  nginx:
    image: nginx:alpine
    container_name: escuela-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - escuela-backend
    networks:
      - escuela-network
    profiles:
      - with-nginx

  # Redis para caché (opcional)
  redis:
    image: redis:7-alpine
    container_name: escuela-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - escuela-network
    profiles:
      - with-redis

# Redes compartidas
networks:
  escuela-network:
    driver: bridge

# Volúmenes persistentes
volumes:
  redis-data:
    driver: local
